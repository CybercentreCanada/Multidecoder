name: tests

trigger: ["*"]
pr: ["*"]

pool:
  vmImage: ubuntu-latest

jobs:
  - job: run_test
    strategy:
      matrix:
        Python3_10:
          python.version: "3.10"
        Python3_11:
          python.version: "3.11"
        Python3_12:
          python.version: "3.12"

    timeoutInMinutes: 10

    steps:
      - task: UsePythonVersion@0
        displayName: Set python version
        inputs:
          versionSpec: "$(python.version)"
      - script: |
          set -x  # Echo commands before they are run
          pip install tox
          tox -e py
        displayName: Test
